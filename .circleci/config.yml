version: 2.1

jobs:
  test:
    parameters:
      dotnet-version:
        type: string
    docker:
      - image: "mcr.microsoft.com/dotnet/sdk:<< parameters.dotnet-version >>"
    steps:
      - run:
          name: Check out the GitHub commit over HTTPS
          command: |
            if ! command -v git >/dev/null 2>&1; then
              apt-get update
              apt-get install -y --no-install-recommends git
            fi

            git init --quiet
            git remote add origin "https://github.com/${CIRCLE_PROJECT_USERNAME}/${CIRCLE_PROJECT_REPONAME}.git"
            GIT_TERMINAL_PROMPT=0 git fetch --depth=1 origin "$CIRCLE_SHA1"
            git checkout --detach FETCH_HEAD
      - run:
          name: Build and test in Release
          command: >-
            dotnet test src/ColorHashSharp.Tests/ColorHashSharp.Tests.csproj
            --configuration Release
            -p:TargetFrameworks=net<< parameters.dotnet-version >>
            -p:GeneratePackageOnBuild=false

workflows:
  dotnet-tests:
    jobs:
      - test:
          matrix:
            parameters:
              dotnet-version: ["10.0", "11.0"]
