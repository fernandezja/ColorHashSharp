version: 2.1

jobs:
  test:
    parameters:
      dotnet-version:
        type: string
    docker:
      - image: "mcr.microsoft.com/dotnet/sdk:<< parameters.dotnet-version >>"
    steps:
      - checkout
      - run:
          name: Build and test in Release
          command: >-
            dotnet test src/ColorHashSharp.Tests/ColorHashSharp.Tests.csproj
            --configuration Release
            -p:TargetFrameworks=net<< parameters.dotnet-version >>
            -p:GeneratePackageOnBuild=false

workflows:
  dotnet-tests:
    jobs:
      - test:
          matrix:
            parameters:
              dotnet-version: ["10.0", "11.0"]
